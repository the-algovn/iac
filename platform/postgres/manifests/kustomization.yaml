apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CNPG is gone as of Phase 3 (2026-08-06): PostgreSQL 18 runs natively on
# algovn-data. What remains here is the selector-less Service + Endpoints that keep
# `pg-rw.postgres.svc:5432` resolving, so no app manifest and no OpenBao URI changed.
#
# The Cluster CR, the Database CRs and the pg-role-*-external ExternalSecrets were
# removed with the operator: roles and databases are now declared in
# ansible/roles/postgres_server/defaults/main.yml and applied with
# `ansible-playbook site.yml --limit data --tags postgres`.
resources:
  - service.yaml
  - endpoints.yaml
