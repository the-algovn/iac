apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio
  namespace: minio
spec:
  podSelector:
    matchLabels: { app: minio }
  policyTypes: [Ingress]
  ingress:
    # S3 API from radio-service + tts-service + tempo, and the Kong ingress
    # controller (public presigned GETs). The minio namespace itself must be
    # here too: the bucket-creation Job runs in this namespace and talks to
    # the Service, so omitting it silently wedged that Job in a retry loop
    # for a week.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: minio }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: radio-service }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: tts-service }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: tracing }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kong }
      ports:
        - { port: 9000, protocol: TCP }
