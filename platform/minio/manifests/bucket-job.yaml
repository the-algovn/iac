apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-radio-lab
  namespace: minio
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          # The official mc images are no longer published; the -dev variant
          # of chainguard's carries the shell these scripts need.
          image: cgr.dev/chainguard/minio-client:latest-dev@sha256:b056b795d31828015aea061e3168267b0ba80590ba2d8f869e72ff77153a68e8
          command: ["/usr/bin/sh", "-c"]
          args:
            - >
              until mc alias set m http://minio.minio.svc:9000 "$U" "$P"; do sleep 2; done;
              mc mb --ignore-existing m/radio-lab;
              mc mb --ignore-existing m/tempo;
              mc mb --ignore-existing m/tts-cache;
              mc mb --ignore-existing m/tts-voices
          env:
            - { name: HOME, value: /tmp }
            - name: U
              valueFrom: { secretKeyRef: { name: minio-root, key: username } }
            - name: P
              valueFrom: { secretKeyRef: { name: minio-root, key: password } }
