fullnameOverride: vm
# VictoriaMetrics STORAGE moved to algovn-obs 2026-08-04 (ansible role
# victoria_metrics). Only the storage half moved: vmagent stays in-cluster so the 19
# VMServiceScrape/VMPodScrape CRs keep working, and remote-writes to the VM.
# The chart resolves {{ .vm.read }}/{{ .vm.write }} as "vmselect, vmsingle, or
# external.vm.*", so these two URLs repoint vmagent, Grafana's datasource and
# vmalert's routing together — verified with `helm template` before this landed.
vmsingle:
  enabled: false
external:
  vm:
    read:
      url: http://192.168.102.115:8428
    # The write URL MUST end in /api/v1/write: the chart uses it verbatim as the
    # VMAgent's remoteWrite.url, and the Prometheus remote-write protocol requires
    # that path. Without it every write is rejected HTTP 400 — silently, from the
    # writer's side. (Cost an outage during the Phase 2 cutover.) The read URL
    # takes no path; Grafana appends its own query paths to the datasource base.
    write:
      url: http://192.168.102.115:8428/api/v1/write
vmagent:
  spec:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      # 256Mi OOMKilled repeatedly after move to algovn-w1 (exit 137, 31 restarts on 2026-07-12)
      limits: { memory: 1Gi }
vmalert:
  spec:
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { memory: 256Mi }
alertmanager:
  enabled: true
  spec:
    configSecret: alertmanager-config
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }
grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  envFromSecret: grafana-oauth   # injects GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
  grafana.ini:
    server:
      root_url: https://grafana.algovn.com
    auth.generic_oauth:
      enabled: true
      name: AlgoVN ID
      auto_login: true
      allow_sign_up: true
      use_pkce: true
      client_id: "381964529237557617"
      scopes: openid profile email urn:zitadel:iam:org:projects:roles
      auth_url: https://id.algovn.com/oauth/v2/authorize
      token_url: https://id.algovn.com/oauth/v2/token
      api_url: https://id.algovn.com/oidc/v1/userinfo
      role_attribute_strict: true
      role_attribute_path: >-
        contains(keys("urn:zitadel:iam:org:project:roles" || `{}`), 'admin') && 'Admin'
        || contains(keys("urn:zitadel:iam:org:project:roles" || `{}`), 'editor') && 'Editor'
        || contains(keys("urn:zitadel:iam:org:project:roles" || `{}`), 'viewer') && 'Viewer'
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  persistence: { enabled: false }
# additionalDataSources is not a key this chart's grafana wrapper reads (verified via
# `helm template`: it silently renders nothing) — extra datasources go through
# defaultDatasources.extra instead, which the chart merges into the vm-grafana-ds ConfigMap.
defaultDatasources:
  extra:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.logging.svc.cluster.local:3100
      access: proxy
      jsonData:
        # Turn the trace_id field of a JSON log line into a link to its trace.
        derivedFields:
          - name: trace_id
            matcherType: label
            matcherRegex: trace_id
            url: "${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.tracing.svc.cluster.local:3200
      access: proxy
      jsonData:
        # And back the other way: from a span to the log lines it produced.
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          filterByTraceID: true
          customQuery: true
          query: '{namespace=~".+"} | json | trace_id="${__trace.traceId}"'
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }
# k3s runs a single binary — the sync job still creates scheduler/controller-manager
# alert groups unless disabled explicitly (kube*.enabled only gates scrapes/dashboards).
defaultRules:
  groups:
    kubernetes-system-scheduler: { create: false }
    kubernetes-system-controller-manager: { create: false }
defaultDashboards:
  enabled: true
