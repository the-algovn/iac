apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tracing
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4
      helm:
        releaseName: tempo
        valueFiles:
          - $values/platform/tracing/tempo-values.yaml
    - repoURL: https://github.com/the-algovn/iac.git
      targetRevision: main
      path: platform/tracing/manifests
    - repoURL: https://github.com/the-algovn/iac.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tracing
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # Client-side apply on purpose. ServerSideApply never writes the
    # last-applied-configuration annotation, so Argo compares the raw git
    # manifest against live and the ExternalSecret's CRD-defaulted fields
    # (conversionStrategy, decodingStrategy, metadataPolicy, deletionPolicy)
    # read as drift no sync can clear. The three-way merge ignores them.
    # ServerSideDiff would also fix it, but the controller gates that feature
    # off cluster-wide (ARGOCD_APPLICATION_CONTROLLER_SERVER_SIDE_DIFF is empty),
    # so the option alone is a no-op. This matches the *-config apps, which hold
    # every other ExternalSecret and stay Synced.
    syncOptions: [CreateNamespace=true]
