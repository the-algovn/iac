apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tracing
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4
      helm:
        releaseName: tempo
        valueFiles:
          - $values/platform/tracing/tempo-values.yaml
    - repoURL: https://github.com/the-algovn/iac.git
      targetRevision: main
      path: platform/tracing/manifests
    - repoURL: https://github.com/the-algovn/iac.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tracing
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # ServerSideDiff is required alongside ServerSideApply: SSA never writes the
    # last-applied-configuration annotation, and without it Argo falls back to
    # comparing the git manifest against live. The ExternalSecret's CRD defaults
    # (conversionStrategy, decodingStrategy, metadataPolicy, target.deletionPolicy)
    # exist only in live, so the app sat permanently OutOfSync — a diff no sync
    # could resolve. ServerSideDiff asks the API server for the merged result
    # instead, which accounts for those defaults.
    syncOptions: [CreateNamespace=true, ServerSideApply=true, ServerSideDiff=true]
