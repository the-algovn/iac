apiVersion: batch/v1
kind: Job
metadata:
  name: the-race-migrate
  namespace: the-race-service
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: { app: the-race-migrate }
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/the-algovn/the-race-service:main
          command: ["/usr/local/bin/the-race-migrate"]
          env:
            - name: PG_URL
              valueFrom: { secretKeyRef: { name: pg-the-race, key: uri } }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
      imagePullSecrets:
        - name: registry-creds
