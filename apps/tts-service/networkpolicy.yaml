apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tts-service
  namespace: tts-service
spec:
  # the-race-service uses the shared tts-service for race commentary.
  podSelector:
    matchLabels: { app: tts-service }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: radio-service }
      ports:
        - { port: 9490, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: the-race-service }
      ports:
        - { port: 9490, protocol: TCP }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # No namespaceSelector needed: a bare podSelector matches pods in this
    # policy's own namespace (tts-service).
    - to:
        - podSelector:
            matchLabels: { app: voxcpm-tts }
      ports:
        - { port: 8080, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: minio }
      ports:
        - { port: 9000, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: tracing }
      ports:
        - { port: 4317, protocol: TCP }
    # MinIO, Redpanda, Redis and Tempo moved to algovn-data (192.168.102.114) in
    # Phase 3. A namespaceSelector cannot match an off-cluster address, so every
    # selector rule above silently stopped permitting this traffic the moment its
    # service left the cluster — this ipBlock is what actually allows it now. The
    # selectors are kept deliberately: they still document intent, and they become
    # live again if a service is ever moved back in-cluster.
    - to:
        - ipBlock: { cidr: 192.168.102.114/32 }
      ports:
        - { port: 9000, protocol: TCP }   # minio
        - { port: 4317, protocol: TCP }   # tempo OTLP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voxcpm-tts
  namespace: tts-service
spec:
  # Model pod: reachable only from tts-service, DNS egress only (HF_HUB_OFFLINE=1).
  podSelector:
    matchLabels: { app: voxcpm-tts }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: tts-service }
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
