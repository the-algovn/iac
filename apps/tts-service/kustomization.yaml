apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - registry-creds-external.yaml
  - minio-creds-external.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - vieneu-deployment.yaml
  - vieneu-service.yaml
  - networkpolicy.yaml
images:
