apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tts-keys
  namespace: tts-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bao
  target:
    name: tts-keys
    creationPolicy: Owner
  data:
    # Only keys that exist in OpenBao may be listed -- a single missing
    # remoteRef fails the WHOLE ExternalSecret and the Secret never
    # materializes. Reuses radio-lab's existing google-tts key rather than
    # provisioning a new OpenBao path.
    - secretKey: google-tts
      remoteRef:
        key: algovn/radio-lab/google-tts
        property: GOOGLE_TTS_API_KEY
