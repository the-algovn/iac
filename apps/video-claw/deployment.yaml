apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-claw
  namespace: video-claw
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels: { app: video-claw }
  template:
    metadata:
      labels: { app: video-claw }
    spec:
      containers:
        - name: video-claw
          image: ghcr.io/the-algovn/video-claw-service:main
          ports:
            - { containerPort: 9290, name: grpc }
          env:
            - { name: LISTEN_ADDR, value: ":9290" }
            - { name: LIBRARY_ROOT, value: "/mnt/jellyfin" }
            - { name: FLARESOLVERR_URL, value: "http://localhost:8191" }
            - { name: LOG_LEVEL, value: "info" }
            - name: PG_URL
              valueFrom: { secretKeyRef: { name: pg-video-claw, key: uri } }
          volumeMounts:
            - { name: nfs, mountPath: /mnt/jellyfin }
          readinessProbe:
            grpc: { port: 9290 }
            initialDelaySeconds: 5
          livenessProbe:
            grpc: { port: 9290 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:latest
          ports:
            - { containerPort: 8191 }
          env:
            - { name: LOG_LEVEL, value: "info" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: video-claw-nfs
      imagePullSecrets:
        - name: registry-creds
