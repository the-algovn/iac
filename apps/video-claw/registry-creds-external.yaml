apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-creds
  namespace: video-claw
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: registry-creds }
  data:
    - secretKey: .dockerconfigjson
      remoteRef: { key: kv/platform/ghcr, property: dockerconfigjson }
