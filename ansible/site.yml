- name: Base OS + zram (all nodes)
  hosts: all
  become: true
  roles:
    - { role: base, tags: [base] }
    - { role: zram, tags: [zram] }

- name: k3s server
  hosts: server
  become: true
  roles:
    - { role: k3s_server, tags: [k3s] }

- name: k3s agents
  hosts: agents
  become: true
  roles:
    - { role: k3s_agent, tags: [k3s] }

- name: Worker network tuning
  hosts: agents
  become: true
  roles:
    - { role: net_tuning, tags: [net_tuning] }

- name: cloudflared host tunnels (remote access)
  hosts: all
  become: true
  roles:
    - { role: cloudflared, tags: [cloudflared], when: cloudflared_tunnel is defined }

# --- Stateful-service VMs (algovn-data, algovn-obs). Kept together and last. ---

- name: Data VM kernel tuning
  hosts: data
  become: true
  roles:
    - { role: db_tuning, tags: [db_tuning] }

- name: Firewall on the stateful VMs
  hosts: data:obs
  become: true
  roles:
    - { role: firewall, tags: [firewall] }

- name: Container runtime on the stateful VMs
  hosts: data:obs
  become: true
  roles:
    - { role: podman_host, tags: [podman] }

- name: Host metrics on the stateful VMs
  hosts: data:obs
  become: true
  roles:
    - { role: node_exporter, tags: [node_exporter] }

- name: Data services on the data VM
  hosts: data
  become: true
  roles:
    - { role: bao_secrets, tags: [minio, redpanda, redis, postgres, tempo] }
    - { role: minio, tags: [minio] }
    - { role: tempo, tags: [tempo] }
    - { role: redpanda, tags: [redpanda] }

- name: Observability services on the obs VM
  hosts: obs
  become: true
  roles:
    - { role: loki, tags: [loki] }
    - { role: uptime_kuma, tags: [uptime_kuma] }
    - { role: victoria_metrics, tags: [victoria_metrics] }
