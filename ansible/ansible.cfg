[defaults]
inventory = inventory.yml
host_key_checking = False
stdout_callback = default
callback_result_format = yaml

[ssh_connection]
# Pipelining streams each module to the remote python over the existing SSH
# session instead of writing it to ~/.ansible/tmp on the managed node first. That
# is what keeps the templated `uri` body in roles/bao_secrets (role_id/secret_id)
# off the node's disk — `no_log` suppresses logging, not transfer.
# Requires `requiretty` to be off in sudoers, which is the Ubuntu 24.04 default.
pipelining = True
