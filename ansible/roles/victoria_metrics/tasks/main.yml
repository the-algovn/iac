- name: Create the VictoriaMetrics data directory
  ansible.builtin.file:
    path: /var/lib/victoria-metrics
    state: directory
    # No owner on purpose: the victoriametrics image declares no USER, so the
    # container runs as root and writes this bind mount as root — unlike Loki,
    # whose image declares USER 10001 and therefore needs the directory chowned.
    # Verified 2026-08-05: `podman image inspect … --format '{{.Config.User}}'` is
    # empty and `podman top systemd-victoria-metrics huser` reports root.
    # This is a real coupling to the image, not a don't-care. If a tag bump ever
    # adds a USER, the service fails at startup on a permission error against
    # /victoria-metrics-data — set owner/group to that uid here, as the loki role
    # does.
    mode: "0755"

- name: Install the VictoriaMetrics quadlet
  ansible.builtin.copy:
    src: victoria-metrics.container
    dest: /etc/containers/systemd/victoria-metrics.container
    mode: "0644"
  notify: restart victoria-metrics

- name: Reload systemd so the quadlet generator runs
  ansible.builtin.systemd:
    daemon_reload: true

- name: Start VictoriaMetrics
  ansible.builtin.systemd:
    name: victoria-metrics.service
    state: started
    enabled: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
