# linux-image-generic, NOT linux-modules-extra-{{ ansible_kernel }}: cloud-image
# kernels ship zram.ko in modules-extra, and the version-pinned name is correct only
# for the kernel running at play time — unattended-upgrades then installs a newer
# kernel and after the reboot zram silently stops (verified dead on both prod nodes
# 2026-08-03). linux-image-generic is the tracking metapackage: it Depends on
# linux-modules-extra-<abi>, so apt keeps them in lockstep. The base image ships
# linux-image-virtual, which depends on the kernel image ALONE — hence the drift.
- name: Install systemd zram generator (+ linux-image-generic for kernel-tracked modules-extra)
  ansible.builtin.apt:
    name:
      - systemd-zram-generator
      - linux-image-generic
    state: present

- name: Configure zram0
  ansible.builtin.copy:
    src: zram-generator.conf
    dest: /etc/systemd/zram-generator.conf
    mode: "0644"
  register: zram_conf

- name: Activate zram0
  ansible.builtin.systemd:
    name: systemd-zram-setup@zram0.service
    state: "{{ 'restarted' if zram_conf.changed else 'started' }}"
    daemon_reload: true
