- name: Create the Redpanda data directory
  ansible.builtin.file:
    path: /var/lib/redpanda
    state: directory
    # The redpanda image runs as uid 101 (redpanda); the bind mount must be
    # writable by it or the broker exits on its first segment write.
    owner: "101"
    group: "101"
    mode: "0750"

- name: Install the Redpanda quadlet
  ansible.builtin.copy:
    src: redpanda.container
    dest: /etc/containers/systemd/redpanda.container
    mode: "0644"
  notify: restart redpanda

- name: Reload systemd so the quadlet generator runs
  ansible.builtin.systemd:
    daemon_reload: true

- name: Start Redpanda
  ansible.builtin.systemd:
    name: redpanda.service
    state: started
    enabled: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
