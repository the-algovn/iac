# Overrides vm.swappiness=100 from base's 99-k8s.conf. That value is correct for
# the k3s nodes (zram-backed swap as compressed-RAM overflow) and wrong here:
# aggressively swapping anonymous pages evicts Postgres shared_buffers into zram,
# spending CPU on compression to reclaim memory the database deliberately reserved.
#
# The "zz" in the filename is load-bearing. systemd-sysctl applies /etc/sysctl.d/*
# in lexicographic order with later files winning, so a name like
# 99-db-tuning.conf would sort BEFORE 99-k8s.conf and be silently overridden.
vm.swappiness = 10
