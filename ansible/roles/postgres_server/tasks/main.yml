- name: Install the PGDG signing key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/pgdg.asc
    mode: "0644"

- name: Add the PGDG apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    filename: pgdg
    state: present

- name: Install PostgreSQL 18, its exporter, and the psycopg the modules need
  ansible.builtin.apt:
    name:
      - postgresql-18
      - prometheus-postgres-exporter
      # community.postgresql executes through psycopg on the managed node; without
      # it every postgresql_* task fails with "the python psycopg module is required".
      - python3-psycopg2
    state: present
    update_cache: true

- name: Install postgresql.conf
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: /etc/postgresql/18/main/conf.d/99-algovn.conf
    owner: postgres
    group: postgres
    mode: "0644"
  notify: restart postgresql

- name: Install pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /etc/postgresql/18/main/pg_hba.conf
    owner: postgres
    group: postgres
    mode: "0640"
  notify: restart postgresql

- name: Flush handlers so the roles below connect to the tuned server
  ansible.builtin.meta: flush_handlers

- name: Enable postgresql and the exporter
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - postgresql
    - prometheus-postgres-exporter

- name: Read each app's Postgres password from OpenBao
  ansible.builtin.uri:
    url: "{{ bao_addr }}/v1/secret/data/algovn/postgres/pg-role-{{ item.bao }}"
    method: GET
    headers:
      X-Vault-Token: "{{ bao_token }}"
    status_code: 200
  register: pg_role_secrets
  no_log: true
  loop: "{{ pg_roles }}"

- name: Create the application roles
  community.postgresql.postgresql_user:
    name: "{{ item.item.name }}"
    password: "{{ item.json.data.data.password }}"
    role_attr_flags: "{{ item.item.attrs | default('LOGIN') }}"
    state: present
  become_user: postgres
  no_log: true
  loop: "{{ pg_role_secrets.results }}"

- name: Create the application databases
  community.postgresql.postgresql_db:
    name: "{{ item.db }}"
    owner: "{{ item.name }}"
    state: present
  become_user: postgres
  loop: "{{ pg_roles }}"

- name: Create the prometheus monitoring role
  community.postgresql.postgresql_user:
    name: prometheus
    role_attr_flags: LOGIN
    state: present
  become_user: postgres
  # no_log not needed — this role has no password; it authenticates via peer.

- name: Grant pg_monitor to prometheus
  community.postgresql.postgresql_membership:
    group: pg_monitor
    target_roles:
      - prometheus
    state: present
  become_user: postgres

- name: Configure the postgres_exporter DATA_SOURCE_NAME
  ansible.builtin.copy:
    dest: /etc/default/prometheus-postgres-exporter
    content: |
      # Unix-socket peer auth — the prometheus OS user maps to the prometheus
      # SQL role. No password exists to store, rotate, or leak.
      DATA_SOURCE_NAME="user=prometheus host=/var/run/postgresql dbname=postgres sslmode=disable"
      ARGS=""
    mode: "0644"
  notify: restart postgres exporter

- name: Flush handlers so the exporter picks up its new config
  ansible.builtin.meta: flush_handlers

- name: Create the pg_dumpall backup directory
  ansible.builtin.file:
    path: /var/backups/pg
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Install pg_dumpall backup script
  ansible.builtin.template:
    src: pg-dumpall-backup.sh.j2
    dest: /usr/local/bin/pg-dumpall-backup
    owner: root
    group: root
    mode: "0755"

- name: Install pg-dumpall systemd service
  ansible.builtin.template:
    src: pg-dumpall.service.j2
    dest: /etc/systemd/system/pg-dumpall.service
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload

- name: Install pg-dumpall systemd timer
  ansible.builtin.template:
    src: pg-dumpall.timer.j2
    dest: /etc/systemd/system/pg-dumpall.timer
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload

- name: Flush handlers so systemd sees the new units
  ansible.builtin.meta: flush_handlers

- name: Enable and start the pg-dumpall timer
  ansible.builtin.systemd:
    name: pg-dumpall.timer
    state: started
    enabled: true
    daemon_reload: true
